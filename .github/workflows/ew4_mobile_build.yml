name: EW4 AI Online Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android debug APK after web checks"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify uploaded project
        shell: bash
        run: |
          python3 - <<'PYBUILD'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile

          expected_parts = 6
          expected_sha = 'a1f58164bb9acf51136a056b57e4050bdca9ad3a0428f68845b1500d664ef751'
          parts = []
          for i in range(1, expected_parts + 1):
              filename = f'ew4_project.zip.part{i:02d}'
              whole = Path(filename)
              if whole.is_file():
                  parts.append(whole)
                  continue
              subparts = sorted(Path('.').glob(filename + '.small*'))
              if not subparts:
                  raise RuntimeError('Missing ' + filename + ' (or its .smallXX subparts)')
              for j, piece in enumerate(subparts, 1):
                  if piece.name != filename + f'.small{j:02d}':
                      raise RuntimeError('Missing/reordered small piece for ' + filename)
              with whole.open('wb') as merged:
                  for piece in subparts:
                      print('Rebuilding', filename, 'using', piece.name)
                      with piece.open('rb') as stream:
                          while data := stream.read(1024 * 1024):
                              merged.write(data)
              parts.append(whole)
          digest = sha256()
          with open('ew4_project.zip', 'wb') as target:
              for part in parts:
                  print('Adding', part.name, part.stat().st_size)
                  with part.open('rb') as source:
                      while data := source.read(1024 * 1024):
                          target.write(data)
                          digest.update(data)
          if digest.hexdigest() != expected_sha:
              raise RuntimeError('ZIP checksum mismatch; please reupload the parts')
          with ZipFile('ew4_project.zip') as archive:
              bad = archive.testzip()
              if bad: raise RuntimeError('Corrupted ZIP member: ' + bad)
              archive.extractall('.')
          required = [
              'rewrite/Ew4.Client/ClientAiBatch.cs',
              'rewrite/Ew4.Client/Ew4.Client.csproj',
              'rewrite/Ew4.Web/Ew4.Web.csproj',
              'rewrite/Ew4.Android/Ew4.Android.csproj',
          ]
          for name in required:
              if not Path(name).is_file(): raise RuntimeError('Missing project file: ' + name)
          print('Source restored. SHA-256 verified.')
          PYBUILD
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile Ew4.Client (Release)
        run: dotnet build rewrite/Ew4.Client/Ew4.Client.csproj -c Release
      - name: Build Ew4.Verify (Release)
        run: dotnet build rewrite/Ew4.Verify/Ew4.Verify.csproj -c Release
      - name: Publish Web application
        run: dotnet publish rewrite/Ew4.Web/Ew4.Web.csproj -c Release -o "$GITHUB_WORKSPACE/dist/web"
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: ew4-web-publish
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Java 17
        if: ${{ inputs.build_android }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: ${{ inputs.build_android }}
        uses: android-actions/setup-android@v3
      - name: Install Android SDK and .NET Android workload
        if: ${{ inputs.build_android }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          dotnet workload install android
      - name: Build Android ARM64 debug APK
        if: ${{ inputs.build_android }}
        run: |
          dotnet publish rewrite/Ew4.Android/Ew4.Android.csproj \
            -c Debug -f net10.0-android -r android-arm64 \
            -p:AndroidPackageFormats=apk -p:AndroidUseSharedRuntime=false
          mkdir -p dist/android
          find rewrite/Ew4.Android/bin/Debug/net10.0-android -type f -name '*.apk' -exec cp '{}' dist/android/ \;
          test -n "$(find dist/android -name '*.apk' -print -quit)"
      - name: Upload Android APK
        if: ${{ inputs.build_android }}
        uses: actions/upload-artifact@v4
        with:
          name: ew4-android-debug-apk
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
